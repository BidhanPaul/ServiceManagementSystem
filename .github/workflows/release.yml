name: Release image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Immutable image tag, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  REGISTRY: europe-west3-docker.pkg.dev
  IMAGE: ${{ vars.GCP_PROJECT_ID }}/servicemanagementsystem-repo/servicemanagementsystem

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "$REGISTRY" --quiet
      - uses: docker/build-push-action@v6
        with:
          context: Service-Management
          file: Service-Management/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ inputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
