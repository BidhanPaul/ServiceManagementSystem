name: CI Pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Service-Management
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
      - name: Make mvnw executable
        run: chmod +x mvnw
      - name: Build with Maven
        run: ./mvnw clean install -DskipTests
      - name: Run tests
        run: ./mvnw test
      - name: Build Docker image
        run: docker build -t servicemanagementsystem:${{ github.sha }} .
      - name: Show that secret is available (safely)
        run: echo "DB_URL is set, length is ${#DB_URL}"
        env:
          DB_URL: ${{ secrets.DB_URL }}