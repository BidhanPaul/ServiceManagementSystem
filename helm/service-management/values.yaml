replicaCount: 2

image:
  repository: europe-west3-docker.pkg.dev/PROJECT_ID/servicemanagementsystem-repo/servicemanagementsystem
  tag: "CHANGEME"
  pullPolicy: IfNotPresent

service:
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

env:
  SPRING_PROFILES_ACTIVE: prod

secretName: service-management-secrets
