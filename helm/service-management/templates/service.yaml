apiVersion: v1
kind: Service
metadata:
  name: {{ include "service-management.fullname" . }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "service-management.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  type: ClusterIP
