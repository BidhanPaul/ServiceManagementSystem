# Database (set these in Render Environment Variables)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA/Hibernate
app.jwt.secret=${JWT_SECRET}
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.id.new_generator_mappings=true
spring.jpa.open-in-view=false

# Expose only operational endpoints; Kubernetes uses these for probe checks.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.info.env.enabled=false

# Hosting port
server.port=${PORT:8080}

employees.feed.url=https://workforcemangementtool.onrender.com/api/employees
employees.feed.cacheSeconds=300
provider.api.enabled=false
